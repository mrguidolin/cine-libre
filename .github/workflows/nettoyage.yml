name: Retirer les titres expirés
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  nettoyage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/retirer_expires.py
      - run: |
          if ! git diff --quiet catalog.json; then
            git config user.name "Ciné Libre"
            git config user.email "actions@users.noreply.github.com"
            git commit -am "Catalogue : retrait des titres expirés"
            git push
          fi
